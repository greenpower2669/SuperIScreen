name: SuperIScreen Android APK

on:
  push:
    branches:
      - 'feature/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android SDK command-line tools not found under $ANDROID_HOME"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SuperIScreen-v0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SuperIScreen-v0.1.0-debug
          path: SuperIScreen-v0.1.0-debug.apk
      - name: Publish direct-download test APK on the development branch
        if: github.ref == 'refs/heads/feature/video-wallpaper-v010'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.0-debug"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SuperIScreen-v0.1.0-debug.apk --clobber
          else
            gh release create "$TAG" SuperIScreen-v0.1.0-debug.apk \
              --target "$GITHUB_SHA" \
              --title "SuperIScreen v0.1.0 — APK de test" \
              --notes "APK Android de test signé avec la clé debug. Importer une vidéo locale après installation. Compilation GitHub Actions validée ; compatibilité et rendu sur le Samsung de Yann restent à tester." \
              --prerelease
          fi
      - name: Publish APK in a GitHub Release when a tag is created
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" SuperIScreen-v0.1.0-debug.apk --title "SuperIScreen ${GITHUB_REF_NAME} (debug)" --notes "APK de test non signé pour distribution Play Store. Installation manuelle seulement."
